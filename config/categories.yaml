# 何時間前までの記事を「今回の対象」とするかを指定します。
lookback_hours: 48

# どのルールにも一致しなかった記事の分類先です。
default_category: Other Important Developments

# キーワードが見つからない場合に使う、情報源ごとの初期分類です。
source_defaults:
  日本銀行: Economy
  WHO News: Medicine / Healthcare
  NASA: Science

# 上から順に同点時の優先順位になります。
